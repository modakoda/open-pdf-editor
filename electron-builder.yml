# electron-builder configuration — https://www.electron.build/configuration
# Build the app first (npm run build), then e.g.:
#   npx electron-builder --mac --dir         unpacked app only (fast local check)
#   npx electron-builder --publish never     installers for the current OS
# Signing is optional: macOS uses CSC_LINK/CSC_KEY_PASSWORD (Developer ID) and notarizes when
# APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are set; Windows uses CSC_LINK/CSC_KEY_PASSWORD.
appId: com.openpdfeditor.app
productName: Open PDF Editor
copyright: Copyright © 2026 Modestas Kažinauskas

directories:
  output: release
  buildResources: build

# Everything the app needs is bundled into out/ by electron-vite (renderer dependencies are
# bundled by Vite; main/preload only use electron and Node built-ins).
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - "!node_modules/**/*"
asar: true
asarUnpack:
  # Window icon used on Linux (imported in src/main/paths.ts with ?asset&asarUnpack).
  - out/main/chunks/*.png
npmRebuild: false

# In-app updates (electron-updater, src/main/updates). electron-builder writes the update
# metadata (latest*.yml, *.blockmap) next to the installers, and this feed into the app as
# resources/app-update.yml. The GitHub provider reads public releases only: while the repository
# is private, end users need public releases (e.g. another, public repository) or a generic feed:
# scripts/generic-feed-config.mjs writes a copy of this file for one (release.yml uses it when the
# UPDATE_FEED_URL repository variable is set); upload the release files there.
publish:
  provider: github
  owner: modakoda
  repo: open-pdf-editor
  releaseType: release

fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Editor
    rank: Alternate

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  # Notarization runs automatically when the APPLE_* environment variables are present.

dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
  artifactName: ${name}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Open PDF Editor
  deleteAppDataOnUninstall: false
  artifactName: ${name}-${version}-win-setup-${arch}.${ext}

portable:
  artifactName: ${name}-${version}-win-portable-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  category: Office
  mimeTypes:
    - application/pdf
  executableName: open-pdf-editor
  # File managers pass local paths (%F) rather than URIs (%U); file:// URIs are accepted too.
  executableArgs: ['%F']
  # The .desktop file is named after package.json "desktopName", which Electron also uses as
  # the Wayland app_id / X11 WM_CLASS, so windows are associated with the launcher entry.
  syncDesktopName: true
  synopsis: Edit, annotate, fill and sign PDF documents
  description: Open PDF Editor is a free, open-source PDF editor for Windows, macOS and Linux.
  maintainer: Modestas Kažinauskas
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Keywords: pdf;editor;annotate;sign;form;

deb:
  artifactName: ${name}_${version}_${arch}.${ext}
