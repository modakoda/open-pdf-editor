<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Open PDF Editor app icon: a document with a signature line and a pen.
       Render to build/icon.png with: npm run icon (see build/generate-icon.mjs). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A55"/>
      <stop offset="1" stop-color="#D3263A"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4F7"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B3445"/>
      <stop offset="0.55" stop-color="#3D4860"/>
      <stop offset="1" stop-color="#232B3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6B0D18" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square background (macOS grid: 824 px body, 100 px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Document sheet with folded corner -->
  <g filter="url(#soft)">
    <path d="M338 218 H600 L712 330 V746 Q712 786 672 786 H338 Q298 786 298 746 V258 Q298 218 338 218 Z" fill="url(#sheet)"/>
    <path d="M600 218 V296 Q600 330 634 330 H712 Z" fill="#F7C1B9"/>
  </g>

  <!-- Text lines -->
  <g fill="#D5DAE2">
    <rect x="362" y="372" width="230" height="26" rx="13"/>
    <rect x="362" y="434" width="286" height="26" rx="13"/>
    <rect x="362" y="496" width="286" height="26" rx="13"/>
    <rect x="362" y="558" width="196" height="26" rx="13"/>
  </g>

  <!-- Signature stroke -->
  <path d="M362 690 C392 640 420 640 432 684 C442 722 470 720 492 682 C510 652 532 652 548 676"
        fill="none" stroke="#D3263A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pen (tip resting at the end of the signature) -->
  <g transform="translate(664 566) rotate(45)">
    <rect x="-46" y="-300" width="92" height="330" rx="22" fill="url(#pen)"/>
    <rect x="-46" y="-236" width="92" height="30" fill="#FFC23D"/>
    <path d="M-46 30 H46 L10 128 Q0 150 -10 128 Z" fill="#F4D7B5"/>
    <path d="M-12 96 H12 L4 140 Q0 150 -4 140 Z" fill="#2B3445"/>
  </g>
</svg>
