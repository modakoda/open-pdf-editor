name: Release

# Builds installers on all three operating systems and publishes them to a GitHub Release. Start it
# either way:
#   - Actions › Release › Run workflow: choose patch, minor, major or an exact version. The run
#     bumps package.json, commits "Release X.Y.Z" and pushes the vX.Y.Z tag to the chosen branch.
#   - Push a tag matching package.json's version (e.g. v0.1.0).
#
# Optional signing secrets (used only when set):
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application .p12, base64 or URL)
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (Authenticode .pfx); falls back to CSC_LINK /
#            CSC_KEY_PASSWORD only if WIN_CSC_LINK is not set and the certificate is a .pfx.
# Without them, macOS builds are ad-hoc signed and Windows builds are unsigned.
#
# In-app updates: the release also gets the update metadata (latest*.yml) and blockmaps. Apps read
# them from this repository's GitHub Releases. Set the repository variable UPDATE_FEED_URL to build
# apps that read a generic feed instead (upload the release files there). Unsigned macOS builds
# cannot update themselves; they link to the release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'patch, minor, major, or an exact version such as 1.0.0 or 0.2.0-beta.1'
        required: true
        default: patch

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      # A tag pushed with GITHUB_TOKEN starts no new workflow run, so this run builds it. The atomic
      # push fails, changing nothing, if the branch moved or the tag exists (e.g. "Re-run all jobs").
      - name: Bump the version and push the tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "$VERSION" -m 'Release %s'
          tag="v$(node -p "require('./package.json').version")"
          git push --atomic origin "HEAD:$GITHUB_REF" "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    env:
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      # Outside the checkout: electron-builder runs scripts from its cache, and inside the checkout
      # they would inherit package.json's "type": "module" and fail.
      - name: Set download cache paths
        run: |
          {
            echo "electron_config_cache=$RUNNER_TEMP/electron"
            echo "ELECTRON_CACHE=$RUNNER_TEMP/electron"
            echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder"
          } >> "$GITHUB_ENV"

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        run: npm run build

      - name: Package installers
        env:
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--publish never)
          if [ -n "$UPDATE_FEED_URL" ]; then
            node scripts/generic-feed-config.mjs "$UPDATE_FEED_URL" electron-builder.feed.yml
            args+=(--config electron-builder.feed.yml)
          fi
          case "$RUNNER_OS" in
            macOS)
              if [ -n "$SECRET_CSC_LINK" ]; then
                export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
                if [ -n "$SECRET_APPLE_ID" ] && [ -n "$SECRET_APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$SECRET_APPLE_TEAM_ID" ]; then
                  export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
                  echo "Signing and notarizing the macOS build"
                else
                  echo "Signing the macOS build (no notarization credentials)"
                fi
              else
                echo "No macOS certificate: ad-hoc signing"
                export CSC_IDENTITY_AUTO_DISCOVERY=false
                args+=(-c.mac.identity=-)
              fi
              ;;
            Windows)
              if [ -n "$SECRET_WIN_CSC_LINK" ]; then
                export WIN_CSC_LINK="$SECRET_WIN_CSC_LINK" WIN_CSC_KEY_PASSWORD="$SECRET_WIN_CSC_KEY_PASSWORD"
                echo "Signing the Windows build"
              elif [ -n "$SECRET_CSC_LINK" ] && [[ "$SECRET_CSC_LINK" == *.pfx ]]; then
                export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
                echo "Signing the Windows build"
              else
                echo "No Windows certificate: unsigned build"
                export CSC_IDENTITY_AUTO_DISCOVERY=false
              fi
              ;;
          esac
          npx electron-builder "${args[@]}"

      - name: Check update metadata
        run: node scripts/check-update-metadata.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" dist/* --title "Open PDF Editor ${TAG#v}" --generate-notes "${prerelease[@]}"
          fi
